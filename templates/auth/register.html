{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-card">
                    <div class="auth-header">
                        <i class="bi bi-person-plus auth-icon"></i>
                        <h2>Join TrekManager</h2>
                        <p class="text-muted">Create your account and start exploring</p>
                    </div>
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label"><i class="bi bi-person"></i> Username *</label>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username" value="{{ request.form.get('username', '') }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label"><i class="bi bi-envelope"></i> Email *</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="your@email.com" value="{{ request.form.get('email', '') }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="full_name" class="form-label"><i class="bi bi-person-badge"></i> Full Name *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="Enter your full name" value="{{ request.form.get('full_name', '') }}">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label"><i class="bi bi-telephone"></i> Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="Your phone number" value="{{ request.form.get('phone', '') }}">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label"><i class="bi bi-lock"></i> Password *</label>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Min 6 characters" minlength="6">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label"><i class="bi bi-lock-fill"></i> Confirm Password *</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label"><i class="bi bi-people"></i> Register as *</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="trekker" {{ 'selected' if request.form.get('role') == 'trekker' else '' }}>Trekker (Participant)</option>
                                <option value="staff" {{ 'selected' if request.form.get('role') == 'staff' else '' }}>Trek Staff (Guide)</option>
                            </select>
                        </div>

                        <!-- Staff-only fields - shown via CSS :has() selector or always visible -->
                        <div class="staff-fields p-3 rounded mb-3" id="staffFields" style="background: rgba(46, 125, 50, 0.08); border: 1px dashed #2e7d32; display: none;">
                            <h6 class="text-success mb-3"><i class="bi bi-briefcase"></i> Staff Details</h6>
                            <div class="mb-3">
                                <label for="specialization" class="form-label">Specialization</label>
                                <input type="text" class="form-control" id="specialization" name="specialization" placeholder="e.g., Mountain Trekking, Rock Climbing" value="{{ request.form.get('specialization', '') }}">
                            </div>
                            <div class="mb-3">
                                <label for="experience" class="form-label">Experience</label>
                                <input type="text" class="form-control" id="experience" name="experience" placeholder="e.g., 5 years" value="{{ request.form.get('experience', '') }}">
                            </div>
                            <div class="mb-3">
                                <label for="bio" class="form-label">Bio</label>
                                <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="Tell us about yourself...">{{ request.form.get('bio', '') }}</textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <i class="bi bi-person-plus"></i> Create Account
                        </button>
                    </form>
                    <div class="auth-footer">
                        <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Minimal JS just to toggle staff fields visibility - NOT core logic -->
<script>
document.getElementById('role').addEventListener('change', function() {
    document.getElementById('staffFields').style.display = this.value === 'staff' ? 'block' : 'none';
});
// On page load, check if staff is selected (for form re-render)
if (document.getElementById('role').value === 'staff') {
    document.getElementById('staffFields').style.display = 'block';
}
</script>
{% endblock %}
