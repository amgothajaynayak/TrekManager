{% extends 'base.html' %}
{% block title %}{{ 'Edit Trek' if mode == 'edit' else 'Create New Trek' }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="page-header">
        <h2><i class="bi bi-signpost-2"></i> {{ 'Edit Trek' if mode == 'edit' else 'Create New Trek' }}</h2>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 800px;">
        <div class="card-body">
            <form action="{{ url_for('admin.edit_trek', trek_id=trek.id) if mode == 'edit' else url_for('admin.create_trek') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Trek Name *</label>
                        <input type="text" class="form-control" id="name" name="name" required value="{{ trek.name if mode == 'edit' else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label for="location" class="form-label">Location *</label>
                        <input type="text" class="form-control" id="location" name="location" required value="{{ trek.location if mode == 'edit' else '' }}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="difficulty" class="form-label">Difficulty *</label>
                        <select class="form-select" id="difficulty" name="difficulty" required>
                            <option value="Easy" {% if mode == 'edit' and trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                            <option value="Moderate" {% if mode == 'edit' and trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                            <option value="Hard" {% if mode == 'edit' and trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="duration_days" class="form-label">Duration (days) *</label>
                        <input type="number" class="form-control" id="duration_days" name="duration_days" min="1" required value="{{ trek.duration_days if mode == 'edit' else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label for="total_slots" class="form-label">Total Slots *</label>
                        <input type="number" class="form-control" id="total_slots" name="total_slots" min="1" required value="{{ trek.total_slots if mode == 'edit' else '' }}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="start_date" class="form-label">Start Date *</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" required value="{{ trek.start_date.strftime('%Y-%m-%d') if mode == 'edit' and trek.start_date else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label for="end_date" class="form-label">End Date *</label>
                        <input type="date" class="form-control" id="end_date" name="end_date" required value="{{ trek.end_date.strftime('%Y-%m-%d') if mode == 'edit' and trek.end_date else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" class="form-control" id="price" name="price" step="0.01" value="{{ trek.price if mode == 'edit' else '' }}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="assigned_staff_id" class="form-label">Assign Staff</label>
                        <select class="form-select" id="assigned_staff_id" name="assigned_staff_id">
                            <option value="">-- No Staff --</option>
                            {% for s in staff_list %}
                            <option value="{{ s.id }}" {% if mode == 'edit' and trek.assigned_staff_id == s.id %}selected{% endif %}>
                                {{ s.full_name }} ({{ s.staff_profile.specialization if s.staff_profile else 'General' }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Pending" {% if mode == 'edit' and trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="Approved" {% if mode == 'edit' and trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                            <option value="Open" {% if mode == 'edit' and trek.status == 'Open' %}selected{% endif %}>Open</option>
                            <option value="Closed" {% if mode == 'edit' and trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if mode == 'edit' and trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4">{{ trek.description if mode == 'edit' else '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">{{ 'Update Trek' if mode == 'edit' else 'Create Trek' }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
