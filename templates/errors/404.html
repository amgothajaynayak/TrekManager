{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-card">
                    <i class="bi bi-compass" style="font-size: 4rem; color: var(--accent);"></i>
                    <h2 class="mt-3">404 — Trail Not Found</h2>
                    <p class="text-muted">Looks like this path doesn't lead anywhere. Let's get you back on track.</p>
                    <a href="/" class="btn btn-primary mt-3">
                        <i class="bi bi-house"></i> Go Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
